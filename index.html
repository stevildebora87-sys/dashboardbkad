<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard BKAD</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
}

/* ================= HEADER ================= */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(to right, #0d6efd, #0a58ca);
  color: white;
  padding: 12px 25px;
  flex-wrap: wrap;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 55px;
  height: 55px;
}

.title {
  font-size: 24px;
  font-weight: bold;
}

.header-right {
  display: flex;
  align-items: flex-end;
  gap: 15px;
  flex-wrap: wrap;
}

.filter-box {
  display: flex;
  flex-direction: column;
  font-size: 13px;
}

.filter-box label {
  margin-bottom: 4px;
  font-weight: bold;
}

.filter-box select,
.filter-box input {
  padding: 7px 10px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  min-width: 160px;
}

/* ================= SEARCH OPD ================= */
.interactive-search {
  position: relative;
}

.results {
  position: absolute;
  top: 105%;
  left: 0;
  right: 0;
  background: white;
  border-radius: 10px;
  max-height: 200px;
  overflow-y: auto;
  display: none;
  z-index: 999;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.results div {
  padding: 10px;
  cursor: pointer;
}

.results div:hover {
  background: #0d6efd;
  color: white;
}

/* ================= CONTAINER ================= */
.container {
  width: 90%;
  margin: auto;
  margin-top: 25px;
}

.section {
  background: white;
  margin-top: 20px;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

/* ================= CARDS ================= */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.card {
  padding: 20px;
  border-radius: 15px;
  color: white;
  font-size: 18px;
  text-decoration: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.blue { background: #007bff; }
.green { background: #28a745; }
.orange { background: #fd7e14; }
.red { background: #dc3545; }

/* ================= CHARTS ================= */
.charts-container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.chart-wrapper {
  flex: 1 1 320px;
}

.chart-wrapper canvas {
  width: 100% !important;
  height: 320px !important;
}

/* ================= TABLE ================= */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th, td {
  padding: 10px;
  border: 1px solid #ddd;
}

th {
  background: #0d6efd;
  color: white;
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<header>
  <div class="header-left">
    <img src="logo-pemda.png" class="logo">
    <span class="title">DASHBOARD BKAD</span>
  </div>

  <div class="header-right">

    <!-- Tahun -->
    <div class="filter-box">
      <label>Tahun</label>
      <select id="tahunFilter">
        <option>2025</option>
        <option>2026</option>
        <option>2027</option>
      </select>
    </div>

    <!-- Dana -->
    <div class="filter-box">
      <label>Sumber Dana</label>
      <select id="danaFilter">
        <option value="Semua">Semua</option>
        <option value="DAU">DAU</option>
        <option value="DAK">DAK</option>
        <option value="DBH">DBH</option>
        <option value="PAD">PAD</option>
        <option value="Hibah">Hibah</option>
      </select>
    </div>

    <!-- OPD Search -->
    <div class="filter-box interactive-search">
      <label>OPD</label>
      <input type="text" id="opdInput" placeholder="Cari OPD...">
      <div class="results" id="opdResults"></div>
    </div>

  </div>
</header>

<div class="container">

<!-- ================= CARDS ================= -->
<div class="cards">
  <div class="card blue">
    <h3>Total Pendapatan</h3>
    <p id="pendapatan">Rp 0 M</p>
  </div>

  <div class="card green">
    <h3>Total Belanja</h3>
    <p id="belanja">Rp 0 M</p>
  </div>

  <div class="card orange">
    <h3>Realisasi</h3>
    <p id="realisasi">0%</p>
  </div>

  <div class="card red">
    <h3>Sisa Anggaran</h3>
    <p id="sisa">Rp 0 M</p>
  </div>
</div>

<!-- ================= CHARTS ================= -->
<div class="section charts-container">

  <!-- BAR -->
  <div class="chart-wrapper">
    <h2>Realisasi OPD per Bulan</h2>
    <canvas id="barChart"></canvas>
  </div>

  <!-- PIE -->
  <div class="chart-wrapper">
    <h2>Top 5 Belanja OPD</h2>
    <canvas id="pieChart"></canvas>
  </div>

</div>

<!-- ================= TABLE ================= -->
<div class="section">
  <h2>Top 5 OPD Berdasarkan Capaian</h2>
  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>OPD</th>
        <th>Anggaran</th>
        <th>Realisasi</th>
        <th>Capaian</th>
      </tr>
    </thead>
    <tbody id="topTable"></tbody>
  </table>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
/* ================= DATA OPD ================= */
const opds = [
  "Dinas Kesehatan","Dinas Pendidikan","Dinas PU","Bappeda","BPKAD",
  "Dinas Sosial","Dinas Perhubungan","Dinas Pertanian","Dinas Pariwisata"
];

const sumberDana = ["DAU","DAK","DBH","PAD","Hibah"];

/* ================= SIMULASI DATA PER DANA ================= */
let dataDana = {};

sumberDana.forEach(dana=>{
  dataDana[dana] = {};
  opds.forEach(opd=>{
    dataDana[dana][opd] = {
      anggaran: Math.floor(Math.random()*200)+100,
      bulanan: Array.from({length:12},()=>Math.floor(Math.random()*40)+60)
    };
  });
});

/* ================= ELEMENT ================= */
const opdInput = document.getElementById("opdInput");
const opdResults = document.getElementById("opdResults");
const danaFilter = document.getElementById("danaFilter");

/* ================= BAR CHART ================= */
const barChart = new Chart(document.getElementById("barChart"),{
  type:"bar",
  data:{
    labels:["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"],
    datasets:[{label:"",data:[]}]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false
  }
});

/* ================= PIE CHART ================= */
const pieChart = new Chart(document.getElementById("pieChart"),{
  type:"pie",
  data:{labels:[],datasets:[{data:[]}]},
  options:{
    responsive:true,
    maintainAspectRatio:false,
    plugins:{legend:{position:"bottom"}}
  }
});

/* ================= UPDATE DASHBOARD ================= */
function updateDashboard(){

  let dana = danaFilter.value;
  if(dana==="Semua") dana="DAU";

  let opd = opdInput.value || opds[0];
  if(!opds.includes(opd)) opd=opds[0];

  /* BAR */
  barChart.data.datasets[0].data = dataDana[dana][opd].bulanan;
  barChart.data.datasets[0].label = `${opd} (${dana})`;
  barChart.update();

  /* PIE TOP 5 */
  let list = opds.map(o=>({
    opd:o,
    anggaran:dataDana[dana][o].anggaran
  }));

  list.sort((a,b)=>b.anggaran-a.anggaran);

  let top5 = list.slice(0,5);

  pieChart.data.labels = top5.map(x=>x.opd);
  pieChart.data.datasets[0].data = top5.map(x=>x.anggaran);
  pieChart.update();

  /* TABLE TOP 5 */
  let tbody = document.getElementById("topTable");
  tbody.innerHTML="";

  top5.forEach((x,i)=>{
    let realisasi = Math.floor(x.anggaran*0.7);
    let persen = ((realisasi/x.anggaran)*100).toFixed(1);

    tbody.innerHTML += `
      <tr>
        <td>${i+1}</td>
        <td>${x.opd}</td>
        <td>Rp ${x.anggaran} M</td>
        <td>Rp ${realisasi} M</td>
        <td>${persen}%</td>
      </tr>
    `;
  });
}

/* ================= SEARCH OPD ================= */
function renderList(filter=""){
  opdResults.innerHTML="";
  let match = opds.filter(o=>o.toLowerCase().includes(filter.toLowerCase()));

  match.forEach(o=>{
    let div=document.createElement("div");
    div.textContent=o;
    div.onclick=()=>{
      opdInput.value=o;
      opdResults.style.display="none";
      updateDashboard();
    };
    opdResults.appendChild(div);
  });
}

opdInput.addEventListener("focus",()=>{
  opdResults.style.display="block";
  renderList();
});

opdInput.addEventListener("input",()=>{
  opdResults.style.display="block";
  renderList(opdInput.value);
});

document.addEventListener("click",(e)=>{
  if(!e.target.closest(".interactive-search")){
    opdResults.style.display="none";
  }
});

/* FILTER EVENT */
danaFilter.addEventListener("change",updateDashboard);
document.getElementById("tahunFilter").addEventListener("change",updateDashboard);

/* INIT */
updateDashboard();
</script>

</body>
</html>

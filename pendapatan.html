<script>
  const opdSelect = document.getElementById("opdFilter");
  const searchInput = document.getElementById("searchOPD");

  // ==============================
  // ISI DROPDOWN OPD
  // ==============================
  function renderDropdown(list) {
    opdSelect.innerHTML = "";

    list.forEach((opd) => {
      const option = document.createElement("option");
      option.value = opd.nama; // simpan nama OPD
      option.textContent = opd.nama;
      opdSelect.appendChild(option);
    });
  }

  // tampilkan semua OPD pertama kali
  renderDropdown(pendapatanData);

  // ==============================
  // CHART INIT
  // ==============================
  const bulanLabels = [
    "Jan","Feb","Mar","Apr","Mei","Jun",
    "Jul","Agu","Sep","Okt","Nov","Des"
  ];

  const barCtx = document.getElementById("barChart");
  const pieCtx = document.getElementById("pieChart");

  let barChart = new Chart(barCtx, {
    type: "bar",
    data: {
      labels: bulanLabels,
      datasets: [{
        label: "Pendapatan Bulanan (Miliar)",
        data: pendapatanData[0].bulanan,
        backgroundColor: "#0d6efd"
      }]
    }
  });

  let pieChart = new Chart(pieCtx, {
    type: "pie",
    data: {
      labels: ["Target", "Realisasi"],
      datasets: [{
        data: [pendapatanData[0].target, pendapatanData[0].realisasi],
        backgroundColor: ["#0d6efd", "#20c997"]
      }]
    }
  });

  // ==============================
  // UPDATE CHART SAAT OPD DIPILIH
  // ==============================
  opdSelect.addEventListener("change", function () {
    const namaDipilih = opdSelect.value;

    // cari data asli dari pendapatanData
    const opd = pendapatanData.find(x => x.nama === namaDipilih);

    if (!opd) return;

    // Update bar chart
    barChart.data.datasets[0].data = opd.bulanan;
    barChart.update();

    // Update pie chart
    pieChart.data.datasets[0].data = [opd.target, opd.realisasi];
    pieChart.update();
  });

  // ==============================
  // SEARCH OPD
  // ==============================
  searchInput.addEventListener("keyup", function () {
    const keyword = searchInput.value.toLowerCase();

    const filtered = pendapatanData.filter(opd =>
      opd.nama.toLowerCase().includes(keyword)
    );

    renderDropdown(filtered);
  });
</script>
